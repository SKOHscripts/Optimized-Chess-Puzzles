name: Code quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pylint

      - name: Run pylint
        run: |
          pylint $(git ls-files '*.py' | grep -v '^tests/') \
            --max-line-length=120 \
            --max-args=8 \
            --max-positional-arguments=8 \
            --max-locals=20 \
            --max-branches=15 \
            --disable=R0903

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt mypy pandas-stubs types-requests

      - name: Run mypy
        run: mypy lichess_optimized_puzzles_datasets.py opening_generator.py --ignore-missing-imports
